name: Build Alpha APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Loyihani ochish
        run: |
          rm -rf proj
          unzip -q project.zip -d proj

      - name: Vosk modelini yuklash
        run: |
          curl -fL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-uz-0.22.zip
          unzip -q model.zip -d m
          d=$(ls -d m/*/ | head -1)
          mkdir -p proj/app/src/main/assets
          mv "$d" proj/app/src/main/assets/model-uz
          ls proj/app/src/main/assets/model-uz

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Litsenziyalar
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: APK yigish
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Reliz yaratish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Alpha build ${{ github.run_number }}
          files: proj/app/build/outputs/apk/debug/app-debug.apk
